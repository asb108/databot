<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Databot Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #1a56db 0%, #7e3af2 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .header p { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 1px; }

    .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #1e2230;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: #1a56db; }

    .field .hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }

    .status-bar {
      background: #1e2230;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.online { background: #22c55e; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    button {
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #1a56db, #7e3af2);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }

    .saved-msg {
      text-align: center;
      font-size: 11px;
      color: #22c55e;
      height: 14px;
      transition: opacity 0.3s;
    }

    .trigger-info {
      background: #1e2230;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .trigger-info code {
      background: #0f1117;
      border-radius: 3px;
      padding: 1px 5px;
      color: #7e3af2;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🤖</div>
    <div>
      <h1>Databot</h1>
      <p>Google Chat Bridge</p>
    </div>
  </div>

  <div class="body">
    <!-- Status -->
    <div class="status-bar">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Checking Databot…</span>
    </div>

    <!-- Webhook URL -->
    <div class="field">
      <label>GChat Incoming Webhook URL</label>
      <input type="text" id="webhookUrl" placeholder="https://chat.googleapis.com/v1/spaces/…"/>
      <div class="hint">
        Paste the <strong>databot-dev</strong> webhook URL you created in your GChat space.
        Databot's replies will be posted here.
      </div>
    </div>

    <!-- Trigger word hint -->
    <div class="trigger-info">
      In Google Chat, type <code>@databot</code> followed by your question.
      The extension will pick it up and reply automatically.
    </div>

    <button id="saveBtn">Save Settings</button>
    <div class="saved-msg" id="savedMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
